<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">土城廣厚宮標誌</title>
  <desc id="desc">金紅色宮廟標誌，包含廣厚宮、福、財與元寶元素。</desc>
  <defs>
    <linearGradient id="logoRed" x1="18" y1="15" x2="162" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bd3125" />
      <stop offset="0.58" stop-color="#8f1d16" />
      <stop offset="1" stop-color="#55120d" />
    </linearGradient>
    <linearGradient id="logoGold" x1="32" y1="18" x2="150" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3b0" />
      <stop offset="0.46" stop-color="#dba63a" />
      <stop offset="1" stop-color="#91540f" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3b1508" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect x="10" y="10" width="160" height="160" rx="34" fill="url(#logoRed)" />
  <path d="M38 56h104l-10-16H48L38 56Z" fill="url(#logoGold)" />
  <path d="M48 58h84v58H48z" fill="#fff7df" opacity="0.95" />
  <path d="M36 118h108v14H36z" fill="url(#logoGold)" />
  <path d="M55 69h70v11H55zM55 91h70v11H55z" fill="#a1261b" opacity="0.18" />
  <circle cx="67" cy="87" r="22" fill="#9f241a" stroke="url(#logoGold)" stroke-width="5" />
  <circle cx="113" cy="87" r="22" fill="#9f241a" stroke="url(#logoGold)" stroke-width="5" />
  <text x="67" y="96" text-anchor="middle" font-family="'Noto Serif TC', 'PingFang TC', serif" font-size="31" font-weight="900" fill="#ffe8a6">福</text>
  <text x="113" y="96" text-anchor="middle" font-family="'Noto Serif TC', 'PingFang TC', serif" font-size="31" font-weight="900" fill="#ffe8a6">財</text>
  <path d="M50 126c7-20 73-20 80 0 8 2 13 8 13 15 0 11-12 19-28 19H65c-16 0-28-8-28-19 0-7 5-13 13-15Z" fill="url(#logoGold)" filter="url(#softShadow)" />
  <path d="M67 126c4-7 42-7 46 0-6 4-40 4-46 0Z" fill="#fff1ad" opacity="0.76" />
  <text x="90" y="150" text-anchor="middle" font-family="'Noto Serif TC', 'PingFang TC', serif" font-size="18" font-weight="900" fill="#5f240b">廣厚宮</text>
</svg>
